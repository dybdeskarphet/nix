set -g clock-mode-colour "{{colors.primary.dark.hex}}"

# copy mode
set -g mode-style 'fg={{colors.on_secondary.dark.hex}},bg={{colors.secondary.dark.hex}},bold'

# panes
set -g pane-border-style 'fg={{colors.outline_variant.dark.hex}}'
set -g pane-active-border-style 'fg={{colors.primary.dark.hex}}'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style ''

set -g status-left-length 40
set -g status-left "#[fg={{colors.primary_container.dark.hex}},bg=default]#[fg={{colors.on_primary_container.dark.hex}},bg={{colors.primary_container.dark.hex}}] #S#[fg={{colors.primary_container.dark.hex}},bg=default] "

set -g status-right-length 60
set -g status-right "#[fg={{colors.primary_container.dark.hex}},bg=default,bold]#[fg={{colors.on_primary_container.dark.hex}},bg={{colors.primary_container.dark.hex}},bold]%Y-%m-%d#[fg={{colors.primary_container.dark.hex}},bg=default,bold] #[fg={{colors.primary_container.dark.hex}},bg=default,bold]#[fg={{colors.on_primary_container.dark.hex}},bg={{colors.primary_container.dark.hex}},bold] %H:%M#[fg={{colors.primary_container.dark.hex}},bg=default,bold] #[fg={{colors.tertiary_container.dark.hex}},bg=default,bold]#[fg={{colors.on_tertiary_container.dark.hex}},bg={{colors.tertiary_container.dark.hex}},bold]󰁹 #(cat /sys/class/power_supply/BAT0/capacity)%%#[fg={{colors.tertiary_container.dark.hex}},bg=default,bold]"

set -g window-status-current-format '#[fg={{colors.primary.dark.hex}},bg=default,bold,nounderscore]#I #[fg={{colors.on_surface.dark.hex}},bold,nounderscore]#W #[fg={{colors.secondary.dark.hex}},bold,nounderscore]#F'
set -g window-status-format '#{?window_bell_flag,#[fg={{colors.error.dark.hex}}],#[fg={{colors.outline.dark.hex}}]}#I #W #{?window_bell_flag,,#F}'

# messages
set -g message-style 'fg={{colors.on_error_container.dark.hex}},bg={{colors.error_container.dark.hex}},bold'

set -g window-status-bell-style ''
