[config]
fallback_color = "#808080"

[config.wallpaper]
command = "wallpaper {{image}}"

[config.custom_colors]
red = { color = "#ff0000", blend = true }
green = { color = "#00ff00", blend = true }
yellow = { color = "#ffcc00", blend = true }
blue = { color = "#0000ff", blend = true }
magenta = { color = "#ff00ff", blend = true }
cyan = { color = "#00ffff", blend = true }

[templates.plaintext]
input_path = '~/.config/matugen/templates/current_colors.txt'
output_path = '~/.config/matugen/references/colors.txt'

[templates.yazilua]
pre_hook = 'mkdir -p ~/.config/yazi/plugins/matugen.yazi'
input_path = '~/.config/matugen/templates/colors.lua'
output_path = '~/.config/yazi/plugins/matugen.yazi/main.lua'

[templates.zathura]
pre_hook = 'mkdir -p ~/.config/zathura'
input_path = '~/.config/matugen/templates/zathura-colors'
output_path = '~/.config/zathura/colors'

[templates.yazi]
pre_hook = 'mkdir -p ~/.config/yazi/flavors/matugen.yazi'
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '~/.config/yazi/flavors/matugen.yazi/flavor.toml'

[templates.btop]
pre_hook = 'mkdir -p ~/.config/btop/themes'
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.matugen]
input_path = '~/.config/matugen/templates/vimium.css'
output_path = '~/.config/matugen/outputs/vimium.css'

[templates.tmux]
input_path = '~/.config/matugen/templates/tmux.conf'
output_path = '~/.config/tmux/colors.conf'

[templates.lazygit]
input_path = '~/.config/matugen/templates/lazygit.yml'
output_path = '~/.config/lazygit/theme.yml'

[templates.tabiew]
input_path = '~/.config/matugen/templates/tabiew.toml'
output_path = '~/.config/tabiew/theme.toml'

[templates.issue]
input_path = '~/.config/matugen/templates/issue_template'
output_path = '~/.config/matugen/references/issue'

[templates.razer]
input_path = "~/.config/matugen/templates/razer-colors.json"
output_path = '~/.config/openrazer/razer-colors.json'
post_hook = "razer-matugen"

[templates.swayimg]
input_path = '~/.config/matugen/templates/swayimg.lua'
output_path = '~/.config/swayimg/colors.lua'
